<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="以 Google 搜索开启每一天，快速访问常用网站，收藏自己的互联网。"><meta name="color-scheme" content="light dark"><title>Navigation · 探索，从这里开始</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/" aria-label="Navigation 首页"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="m26 13-4 10-9 4 4-10z"/><circle cx="20" cy="20" r="1"/></svg>Navigation</a><div class="utilities"><time id="date"></time><button id="theme" aria-label="切换主题">☼ <span>浅色主题</span></button></div></header>
<main><section class="hero" aria-labelledby="headline"><h1 id="headline">探索，从这里开始。</h1><p>让每一次搜索，都更接近答案。</p><form id="search" action="https://www.google.com/search" method="get"><span class="google" aria-hidden="true">G</span><input id="query" name="q" type="search" aria-label="搜索关键词" placeholder="搜索 Google，发现更多可能" required autocomplete="off"><button class="primary" type="submit">搜索</button></form><div class="modes" role="group" aria-label="搜索模式"><button class="active" data-mode="all" aria-pressed="true">全部</button><button data-mode="images" aria-pressed="false">图片</button><button data-mode="scholar" aria-pressed="false">学术</button><button data-mode="translate" aria-pressed="false">翻译</button></div></section>
<section class="shortcuts" aria-labelledby="sites-title"><div class="section-head"><h2 id="sites-title">常用网站</h2><button id="add">＋ 添加网站</button></div><div id="categories" role="group" aria-label="网站分类"></div><div id="sites" class="grid"></div><p id="status" role="status"></p></section></main><footer><a href="https://github.com/dark8ranger/navigation" target="_blank" rel="noopener noreferrer">Navigation</a><p>少一点寻找，多一点发现。</p></footer>
<dialog id="editor"><form id="site-form"><h2>添加网站</h2><label>网站名称<input name="name" required maxlength="30" placeholder="例如：我的博客"></label><label>网站地址<input name="url" type="url" required placeholder="https://example.com"></label><p class="hint">自定义网站仅保存在当前浏览器。</p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div><p id="error" role="alert"></p></form></dialog></body></html>
